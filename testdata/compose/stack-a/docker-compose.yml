services:
  app:
    image: hashicorp/http-echo:1.0
    command: ["-text=A", "-listen=:8080"]
    labels:
      stacklane.enable: "true"
      stacklane.project: "curri"
      stacklane.instance: "alpha"
      stacklane.endpoint: "app"
      stacklane.port: "8080"
    ports:
      - "127.0.0.1::8080"
